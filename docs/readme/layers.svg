<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-label="Three layers: L0 the spec-code graph in git, L1 agent sessions in isolated worktrees on top of it, L2 the dashboard reading L1.">
<style>
svg{--fg:#1f2328;--mute:#6e7781;--rule:#d0d7de;--acc:#0e7c86}
@media (prefers-color-scheme:dark){svg{--fg:#e6edf3;--mute:#8b949e;--rule:#30363d;--acc:#39c5cf}}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:var(--mute)}
.fg{fill:var(--fg)} .acc{fill:var(--acc)} .bar{fill:var(--acc)}
.rule{stroke:var(--rule);stroke-width:1}
.hl{opacity:0;animation:lit 4.800000000000001s linear infinite}
@keyframes lit{0%{opacity:0}6%{opacity:1}27%{opacity:1}33%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.hl{animation:none} .L0 .hl{opacity:1}}
</style>
<g class="row L2">
<text x="60" y="58" style="font-size:28px;font-weight:700">L2</text>
<text x="60" y="82" style="font-size:13px">Dashboard</text>
<g class="hl" style="animation-delay:3.2s"><rect x="40" y="34" width="3" height="54" rx="1.5" class="bar"/><text x="60" y="58" class="acc" style="font-size:28px;font-weight:700">L2</text><text x="60" y="82" class="acc" style="font-size:13px">Dashboard</text></g>
<text x="190" y="54" class="fg" style="font-size:17px">one workspace for every project</text>
<text x="190" y="82" xml:space="preserve">spex dashboard · graph, sessions, terminals · a URL per view</text>
<text x="900" y="54" text-anchor="end" style="font-size:13px">reads L1</text>
<line x1="60" y1="104" x2="900" y2="104" class="rule"/></g>
<g class="row L1">
<text x="60" y="154" style="font-size:28px;font-weight:700">L1</text>
<text x="60" y="178" style="font-size:13px">Sessions</text>
<g class="hl" style="animation-delay:1.6s"><rect x="40" y="130" width="3" height="54" rx="1.5" class="bar"/><text x="60" y="154" class="acc" style="font-size:28px;font-weight:700">L1</text><text x="60" y="178" class="acc" style="font-size:13px">Sessions</text></g>
<text x="190" y="150" class="fg" style="font-size:17px">agents in isolated worktrees</text>
<text x="190" y="178" xml:space="preserve">spex session new · a branch per task · review → merge</text>
<text x="900" y="150" text-anchor="end" style="font-size:13px">runs on L0</text>
<line x1="60" y1="200" x2="900" y2="200" class="rule"/></g>
<g class="row L0">
<text x="60" y="250" style="font-size:28px;font-weight:700">L0</text>
<text x="60" y="274" style="font-size:13px">Specs</text>
<g class="hl" style="animation-delay:0.0s"><rect x="40" y="226" width="3" height="54" rx="1.5" class="bar"/><text x="60" y="250" class="acc" style="font-size:28px;font-weight:700">L0</text><text x="60" y="274" class="acc" style="font-size:13px">Specs</text></g>
<text x="190" y="246" class="fg" style="font-size:17px">the spec–code graph, in plain git</text>
<text x="190" y="274" xml:space="preserve">.spec/**/spec.md · code: anchors · spex spec lint</text>
<text x="900" y="246" text-anchor="end" style="font-size:13px">works alone, offline</text>
<line x1="60" y1="296" x2="900" y2="296" class="rule"/></g>
</svg>
